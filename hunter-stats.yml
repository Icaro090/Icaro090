name: ⚔️ Hunter System Sync

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia às 02:17 de Cuiabá (06:17 UTC)
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/hunter-stats.yml"

permissions:
  contents: write

concurrency:
  group: hunter-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular progresso e atualizar README
        env:
          # HUNTER_TOKEN (opcional): token pessoal para incluir contribuições privadas.
          # Sem ele, o token padrão do Actions lê apenas a atividade pública.
          GH_TOKEN: ${{ secrets.HUNTER_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/hunter_stats.py

      - name: Commitar se houve mudança
        run: |
          if git diff --quiet README.md; then
            echo "Nenhuma mudança no progresso."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "⚔️ Hunter System: progresso sincronizado"
          git push
